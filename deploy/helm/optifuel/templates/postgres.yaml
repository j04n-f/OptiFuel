{{- if .Values.postgres.enabled }}
{{- $postgres := dict "root" $ "component" "postgres" }}
{{- /* kind only. Pre-install hooks, so they exist before the migrate hook. ponytail: hooks sit
outside the release and data lives in the container; production uses managed Postgres. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "optifuel.labels" $postgres | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
spec:
  selector:
    {{- include "optifuel.selector" $postgres | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels:
    {{- include "optifuel.labels" $postgres | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
data:
  # Runs once, on an empty data directory. The default privilege covers the tables migrate
  # creates later as `optifuel`; `keda` only ever counts `procrastinate_jobs`.
  keda.sh: |
    set -eu
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<EOSQL
    CREATE ROLE keda LOGIN PASSWORD '$KEDA_PASSWORD';
    ALTER DEFAULT PRIVILEGES FOR ROLE optifuel IN SCHEMA public GRANT SELECT ON TABLES TO keda;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "optifuel.labels" $postgres | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "optifuel.selector" $postgres | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optifuel.labels" $postgres | nindent 8 }}
    spec:
      {{- include "optifuel.podSecurity" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: optifuel
            - name: POSTGRES_DB
              value: optifuel
            {{- include "optifuel.secretEnv" (dict "root" $ "env" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- include "optifuel.secretEnv" (dict "root" $ "env" "KEDA_PASSWORD" "key" "keda-password") | nindent 12 }}
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: [pg_isready, -U, optifuel]
            periodSeconds: 2
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
{{- end }}
