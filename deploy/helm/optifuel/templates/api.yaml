{{- $api := dict "root" $ "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "optifuel.labels" $api | nindent 4 }}
spec:
  # No `replicas`: the HPA owns the count.
  selector:
    matchLabels:
      {{- include "optifuel.selector" $api | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optifuel.labels" $api | nindent 8 }}
    spec:
      containers:
        - name: api
          {{- include "optifuel.image" . | nindent 10 }}
          {{- include "optifuel.securityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "optifuel.env" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /health, port: http}
          # Postgres down takes the pod out of the Service; liveness keeps it running.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "optifuel.labels" $api | nindent 4 }}
spec:
  selector:
    {{- include "optifuel.selector" $api | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "optifuel.labels" $api | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.cpuUtilization }}
