image:
  repository: optifuel
  # `tag: dev` is mutable and for local/kind only. Production sets `digest`
  # (`docker buildx imagetools inspect`); renders `repository:tag@digest`. Empty keeps
  # `repository:tag`.
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

environment: prod

# Existing Secret (keys `database-url`, `weather-token`, plus `postgres-password` for in-chart
# Postgres). KEDA connects with `database-url` from its own namespace: use a full hostname.
secret:
  name: optifuel

# Airline code → tenant: worker Deployment, model ConfigMap, ScaledObject. `model` is the model
# file's JSON: `--set-file tenants.ABC.model=models/ABC/2026-09-30.json`.
tenants: {}
#  ABC:
#    aircraftTypes: [B777]
#    modelVersion: "2026-09-30"   # quoted: a bare date is not a string in YAML
#    minReplicas: 1               # optional, overrides worker.minReplicas; 0 allowed
#    maxReplicas: 10              # optional, overrides worker.maxReplicas

api:
  hpa:
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

worker:
  minReplicas: 1
  maxReplicas: 10
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

# External weather API. Ignored when `weatherStub.enabled`.
weather:
  url: ""

keda:
  # Off: each worker runs its min replicas and nothing scales it.
  enabled: true
  # Jobs queued or running per worker replica before KEDA adds one.
  targetQueueLength: 10

cleanup:
  schedule: "*/5 * * * *"
  retentionDays: 30

# kind only: in-cluster stand-ins for managed Postgres and the external weather API.
postgres:
  enabled: false
  image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

weatherStub:
  enabled: false
  # Not -alpine: that variant is amd64-only.
  image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
  # WireMock mapping JSON: `--set-file weatherStub.mapping=deploy/weather-stub/mappings/winds.json`.
  mapping: ""
