[project]
name = "optifuel"
version = "0.1.0"
description = "Fuel flow analysis (exercise 1) and OptiFuel, a multi-tenant fuel estimate job processor (exercise 2)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
analysis = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.uv.build-backend]
module-name = "optifuel"

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "N",            # naming
    "S",            # bandit (security)
    "PTH",          # pathlib over os.path
    "PT",           # pytest style
    "RUF",          # ruff-specific
    "PD",           # pandas-vet
    "NPY",          # numpy
    "FAST",         # fastapi
    "ASYNC",        # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests
"*.ipynb" = ["E402", "S301"]  # imports mid-notebook; dataset is provided as pickle

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=optifuel", "--cov-report=term-missing"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]  # surface deprecations before they break
